## FreeRADIUS SQL queries for PostgreSQL
## Adapted from FreeRADIUS default queries.conf for postgresql

# authorize (radcheck) -- find auth attributes
authorize_check_query = "SELECT id, username, attribute, op, value FROM radcheck WHERE username = '%{SQL-User-Name}' ORDER BY id"

# authenticate (radcheck) -- check password
authenticate_query = "SELECT id, username, attribute, op, value FROM radcheck WHERE username = '%{SQL-User-Name}' AND (attribute = 'Cleartext-Password' OR attribute = 'Password') ORDER BY id"

# reply attributes
reply_query = "SELECT id, username, attribute, op, value FROM radreply WHERE username = '%{SQL-User-Name}' ORDER BY id"

# groupreply
groupreply_query = "SELECT id, groupname, attribute, op, value FROM radgroupreply WHERE groupname = (SELECT groupname FROM radusergroup WHERE username = '%{SQL-User-Name}' LIMIT 1) ORDER BY id"

# group membership
member_query = "SELECT id, username, groupname FROM radusergroup WHERE username = '%{SQL-User-Name}' ORDER BY id"

# accounting insert
acct_insert_query = "INSERT INTO radacct (acctsessionid, acctuniqueid, username, realm, nasipaddress, acctstarttime, acctstoptime, acctsessiontime, acctinterval, acctauthentic, connectinfo_start, connectinfo_stop, acctinputoctets, acctoutputoctets, calledstationid, callingstationid, acctterminatecause, servicetype, framedprotocol) VALUES ('%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', '%{SQL-User-Name}', '%{Realm}', '%{NAS-IP-Address}', NOW(), NULL, 0, 0, '%{Acct-Authentic}', '%{Connect-Info}', NULL, '%{Acct-Input-Octets}', '%{Acct-Output-Octets}', '%{Called-Station-Id}', '%{Calling-Station-Id}', '%{Acct-Terminate-Cause}', '%{Service-Type}', '%{Framed-Protocol}')"

# accounting update (stop)
acct_update_query = "UPDATE radacct SET acctstoptime = NOW(), acctsessiontime = EXTRACT(EPOCH FROM (NOW() - acctstarttime))::integer, acctinputoctets = COALESCE(acctinputoctets,0) + %{Acct-Input-Octets}, acctoutputoctets = COALESCE(acctoutputoctets,0) + %{Acct-Output-Octets} WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"

# postauth
postauth_query = "INSERT INTO radpostauth (username, pass, reply, authdate) VALUES ('%{User-Name}', '%{Cleartext-Password}', '%{Auth-Type}', NOW())"

# nas / clients lookup
client_query = "SELECT id, nasname, shortname, type, secret, server, community, description FROM nas WHERE nasname = '%{Client-IP-Address}'"

# read clients (used by sql module to populate clients table)
read_clients_query = "SELECT id, nasname, shortname, type, secret, server, community FROM nas"

